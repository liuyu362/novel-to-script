<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>登录 — AI 小说转剧本工具</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --border: #e2e6ea;
            --text: #212529;
            --text-secondary: #6c757d;
            --primary: #4a6cf7;
            --primary-hover: #3b5de7;
            --primary-light: #eef1ff;
            --danger: #ef4444;
            --radius: 12px;
            --radius-sm: 6px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            width: 400px;
            max-width: 92vw;
            padding: 36px 32px 28px;
        }

        .login-card h1 {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 6px;
        }

        .login-card .subtitle {
            text-align: center;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        /* Tab 切换 */
        .tab-row {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 24px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            font-family: inherit;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.15s;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        /* 表单 */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: inherit;
            color: var(--text);
            background: var(--bg);
            transition: border-color 0.15s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .form-err {
            color: var(--danger);
            font-size: 12px;
            margin-top: 6px;
            min-height: 18px;
        }

        .btn-primary {
            width: 100%;
            padding: 12px 0;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s;
        }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-primary:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .hidden-by-auth { display: none !important; }
    </style>
</head>
<body>

<div class="login-card" id="loginCard">
    <h1>AI 小说转剧本</h1>
    <p class="subtitle">登录后开始创作</p>

    <div class="tab-row">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">登录</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">注册</button>
    </div>

    <div id="formLogin">
        <div class="form-group">
            <label for="loginNickname">昵称</label>
            <input type="text" id="loginNickname" placeholder="输入昵称" maxlength="20" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="loginPassword">密码</label>
            <input type="password" id="loginPassword" placeholder="输入密码" maxlength="32" autocomplete="current-password">
        </div>
        <div class="form-err" id="loginErr"></div>
        <button class="btn-primary" id="loginBtn" onclick="submitLogin()">登录</button>
    </div>

    <div id="formRegister" class="hidden-by-auth">
        <div class="form-group">
            <label for="regNickname">昵称</label>
            <input type="text" id="regNickname" placeholder="输入昵称（2-20字）" maxlength="20" autocomplete="username">
        </div>
        <div class="form-group">
            <label for="regPassword">密码</label>
            <input type="password" id="regPassword" placeholder="输入密码（≥4位）" maxlength="32" autocomplete="new-password">
        </div>
        <div class="form-group">
            <label for="regPassword2">确认密码</label>
            <input type="password" id="regPassword2" placeholder="再次输入密码" maxlength="32" autocomplete="new-password">
        </div>
        <div class="form-err" id="regErr"></div>
        <button class="btn-primary" id="regBtn" onclick="submitRegister()">注册</button>
    </div>
</div>

<script>
let currentMode = 'login';

function switchTab(mode) {
    currentMode = mode;
    document.getElementById('tabLogin').classList.toggle('active', mode === 'login');
    document.getElementById('tabRegister').classList.toggle('active', mode === 'register');
    document.getElementById('formLogin').classList.toggle('hidden-by-auth', mode !== 'login');
    document.getElementById('formRegister').classList.toggle('hidden-by-auth', mode !== 'register');
    document.getElementById('loginErr').textContent = '';
    document.getElementById('regErr').textContent = '';
}

function escHtml(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}


// ── 登录 ──
async function submitLogin() {
    var nickname = document.getElementById('loginNickname').value.trim();
    var password = document.getElementById('loginPassword').value;
    var errEl = document.getElementById('loginErr');
    errEl.textContent = '';

    if (!nickname) { errEl.textContent = '请输入昵称'; return; }
    if (!password) { errEl.textContent = '请输入密码'; return; }

    var btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = '登录中...';

    try {
        var resp = await fetch('/api/users/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nickname: nickname, password: password }),
        });
        var d = await resp.json();

        if (d.code !== 0) {
            errEl.textContent = d.message || '登录失败';
            btn.disabled = false;
            btn.textContent = '登录';
            return;
        }

        localStorage.setItem('auth_token', d.data.token);
        localStorage.setItem('auth_nickname', d.data.nickname || '');
        window.location.href = '/index.html';
    } catch (err) {
        errEl.textContent = '网络错误：' + err.message;
        btn.disabled = false;
        btn.textContent = '登录';
    }
}

// ── 注册 ──
async function submitRegister() {
    var nickname = document.getElementById('regNickname').value.trim();
    var password = document.getElementById('regPassword').value;
    var password2 = document.getElementById('regPassword2').value;
    var errEl = document.getElementById('regErr');
    errEl.textContent = '';

    if (nickname.length < 2) { errEl.textContent = '昵称至少2个字符'; return; }
    if (password.length < 4) { errEl.textContent = '密码至少4个字符'; return; }
    if (password !== password2) { errEl.textContent = '两次密码不一致'; return; }

    var btn = document.getElementById('regBtn');
    btn.disabled = true;
    btn.textContent = '注册中...';

    try {
        var resp = await fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nickname: nickname, password: password }),
        });
        var d = await resp.json();

        if (d.code !== 0) {
            errEl.textContent = d.message || '注册失败';
            btn.disabled = false;
            btn.textContent = '注册';
            return;
        }

        localStorage.setItem('auth_token', d.data.token);
        localStorage.setItem('auth_nickname', d.data.nickname || '');
        window.location.href = '/index.html';
    } catch (err) {
        errEl.textContent = '网络错误：' + err.message;
        btn.disabled = false;
        btn.textContent = '注册';
    }
}

// ── 回车键提交 ──
document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        if (currentMode === 'login') submitLogin();
        else submitRegister();
    }
});

// ── 页面加载：直接显示登录表单，不做自动跳转 ──
</script>

</body>
</html>
