# ============================================================
# 小说转剧本 YAML Schema 定义
# 版本: 2.0
# 说明: 本 Schema 定义了一套将小说文本转换为结构化剧本的标准格式（全中文字段名）
# ============================================================

# 顶层结构
元信息:                  # 剧本元信息
  标题: ""              # 剧本标题
  原著作: ""            # 原著小说标题
  版本: "电影版"        # 剧本版本: 电影版 | 电视剧版 | 舞台剧版
  总场景数: 0           # 场景总数
  角色数量: 0           # 角色总数
  生成时间: ""          # 生成时间 (ISO 8601)

角色列表:                # 角色清单
  - 编号: 1             # 角色编号
    姓名: ""            # 角色姓名
    别名: []            # 别名/称号
    性别: ""            # 性别: 男 | 女 | 未知
    年龄: ""            # 年龄描述
    角色类型: ""        # 角色类型: 主角 | 配角 | 反派 | 路人
    描述: ""            # 角色外貌、性格、身份简述
    首次出场: 0         # 首次出场的场景编号

场景列表:                # 场景清单
  - 编号: 1             # 场景编号
    名称: ""            # 场景名称
    地点: ""            # 场景地点
    时间: ""            # 时间描述（白天/夜晚/清晨等）
    天气: ""            # 天气/环境
    出场角色: []        # 当前场景出场角色姓名列表
    内容:               # 场景内容（动作和对话序列）
      - 类型: 动作      # 类型: 动作 | 对白 | 导演指示
        文本: ""        # 内容文本
        角色: ""        # 执行角色（动作时为执行者，对白时为说话人）
        情绪: ""        # 情绪/语气
        备注: ""        # 补充说明
      - 类型: 对白
        文本: ""
        角色: ""
        情绪: ""
        备注: ""

# ============================================================
# Schema 设计逻辑
# ============================================================
# 1. 三层结构: 元信息 → 角色列表 → 场景列表
#    从宏观（剧本信息）到中观（角色体系）再到微观（逐场景展开）
#
# 2. 场景列表[].内容 采用结构化动作/对话混合
#    类型=动作  : 描述性动作/环境变化
#    类型=对白  : 角色对白
#    类型=导演指示: 导演指示/舞台指导
#
# 3. 多版本支持: 元信息.版本 区分电影/电视剧/舞台剧
#    不同版本在同一 Schema 下产出，只是内容侧重不同
#
# 4. 全中文化设计（v2.0）
#    所有字段名使用中文，降低非技术用户的理解门槛
#    值域同样使用中文（如 "电影版"/"电视剧版"/"舞台剧版"）
